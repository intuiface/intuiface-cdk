name: build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The converter icon template (*.png) is stored in Git LFS
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          
      - name : Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e